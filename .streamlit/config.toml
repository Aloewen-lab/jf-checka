[theme]
# Explizit hell: die Chart-Palette ist gegen diese Oberfläche validiert
# (#fcfcfb, ΔE-Prüfung siehe PLAN.md §4). Ein automatischer Dark-Flip wäre
# nicht validiert, deshalb kein Theme-Toggle.
base = "light"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"

[server]
headless = true
